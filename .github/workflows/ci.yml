name: CI - Validación automática

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar sintaxis
        run: python -m compileall -q app.py tests
      - name: Ejecutar pruebas y generar reporte
        run: |
          mkdir -p reportes
          python -m unittest discover -s tests -v 2>&1 | tee reportes/pruebas.txt
          test ${PIPESTATUS[0]} -eq 0
      - name: Guardar artefacto de ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: reportes/pruebas.txt
          if-no-files-found: warn
